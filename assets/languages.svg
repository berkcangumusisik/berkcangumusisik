  </linearGradient>
</defs>
<rect x="0.5" y="0.5" width="499" height="229" rx="16" fill="#111823" stroke="#253041"/>
<rect x="24" y="0.5" width="452" height="2" rx="1" fill="url(#accent)"/>
<defs><clipPath id="bar"><rect x="24" y="66" width="452" height="10" rx="5"/></clipPath></defs>
<text class="sans fade" x="24" y="44" font-size="18" font-weight="700" fill="#E6EDF3">Most Used Languages</text>
<text class="sans fade" x="476" y="44" font-size="12" fill="#8B949E" text-anchor="end">by primary language of repos</text>
