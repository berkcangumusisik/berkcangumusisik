  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle class="orb1" cx="180" cy="40" r="170" fill="#00D4FF" fill-opacity="0.22" filter="url(#blur)"/>
  <circle class="orb2" cx="1080" cy="320" r="190" fill="#8B5CF6" fill-opacity="0.28" filter="url(#blur)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="339" rx="20" stroke="#253041"/>

