<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-label="Berkcan Gümüşışık: Full Stack Developer and AI Builder">
<title>Berkcan Gümüşışık: Full Stack Developer and AI Builder</title>
<style>
  .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade { animation: fadeUp .7s ease-out both; }
  
  @keyframes float1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(60px, 30px); } }
  @keyframes float2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-70px, -25px); } }
  @keyframes blink { 50% { opacity: 0; } }
  .orb1 { animation: float1 14s ease-in-out infinite; }
  .orb2 { animation: float2 16s ease-in-out infinite; }
  .cursor { animation: blink 1s step-end infinite; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
